<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Records</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Attendance Records</h1>

    <nav>
        <a href="{{ url_for('admin') }}">Admin Enrollment</a>
        <a href="{{ url_for('attendance') }}">Attendance</a>
        <a href="{{ url_for('records') }}">Attendance Records</a>
    </nav>

    <div class="card">

        <h2>Attendance History</h2>

        {% if records %}

        <table>

            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Student Name</th>
                    <th>Date</th>
                    <th>Time</th>
                </tr>
            </thead>

            <tbody>

                {% for record in records %}

                <tr>
                    <td>{{ record[0] }}</td>
                    <td>{{ record[1] }}</td>
                    <td>{{ record[2] }}</td>
                    <td>{{ record[3] }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        {% else %}

        <p class="info">
            No attendance records found.
        </p>

        {% endif %}

    </div>

</div>

</body>
</html>
